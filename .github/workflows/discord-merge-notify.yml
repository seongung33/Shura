name: Discord Merge Notification

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - main

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Send merge notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          message = (
              "✅ **PR 머지 완료**\n"
              f"**저장소:** {os.environ['REPOSITORY']}\n"
              f"**PR:** #{os.environ['PR_NUMBER']} {os.environ['PR_TITLE']}\n"
              f"**브랜치:** `{os.environ['HEAD_BRANCH']}` → `{os.environ['BASE_BRANCH']}`\n"
              f"**머지한 사람:** {os.environ['MERGED_BY']}\n"
              f"{os.environ['PR_URL']}"
          )

          payload = json.dumps({
              "username": "Shura GitHub",
              "content": message
          }).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": (
                      f"DiscordBot "
                      f"(https://github.com/{os.environ['REPOSITORY']}, 1.0)"
                  ),
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord response: {response.status}")
          PY
